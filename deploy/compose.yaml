# EZDR portal behind Caddy, with automatic HTTPS from Let's Encrypt.
#
# 1. Point a DNS name (for example, portal.example.com) at this server.
# 2. Allow inbound TCP 80 and 443 and UDP 51820.
# 3. Copy .env.example to .env and set EZDR_DOMAIN.
# 4. docker compose up -d, then open https://<EZDR_DOMAIN> and use the setup
#    code from `docker compose logs portal`.

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      EZDR_DOMAIN: ${EZDR_DOMAIN:?set EZDR_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  portal:
    image: ghcr.io/jlbyh2o/ezdr-portal:${EZDR_VERSION:?set EZDR_VERSION in .env}
    restart: unless-stopped
    # The portal needs no privileges: its WireGuard runs in userspace.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      EZDR_PUBLIC_URL: https://${EZDR_DOMAIN}
    ports:
      - "51820:51820/udp"
    volumes:
      - portal-data:/data

volumes:
  caddy-data:
  caddy-config:
  portal-data:
