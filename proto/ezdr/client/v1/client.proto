syntax = "proto3";

package ezdr.client.v1;

import "ezdr/inventory/v1/inventory.proto";
import "google/protobuf/timestamp.proto";

// ClientService is served only on the portal's tunnel listener. The portal
// identifies the calling host by its tunnel source address.
service ClientService {
  // Subscribe opens the command stream. The portal sends the current desired
  // state first, then heartbeats and any updates.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // ReportStatus reports the client's health and applied configuration.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);

  // ReportInventory sends the host's current inventory.
  rpc ReportInventory(ReportInventoryRequest) returns (ReportInventoryResponse);

  // AckAction reports the outcome of an action.
  rpc AckAction(AckActionRequest) returns (AckActionResponse);

  // ReportReplication reports the status of EZDR's zrepl jobs on the host.
  rpc ReportReplication(ReportReplicationRequest) returns (ReportReplicationResponse);
  // ReportGuestConfigs reports the configurations the desired state asks
  // for; it replaces the host's previous report.
  rpc ReportGuestConfigs(ReportGuestConfigsRequest) returns (ReportGuestConfigsResponse);
}

message SubscribeRequest {
  string client_version = 1;
}

message SubscribeResponse {
  oneof message {
    Heartbeat heartbeat = 1;
    DesiredState desired_state = 2;
    Action action = 3;
  }
}

// Action is a one-off operation the portal asks the host to perform.
message Action {
  string id = 1;
  oneof kind {
    RefreshInventory refresh_inventory = 2;
    ZreplPreflight zrepl_preflight = 3;
    ZreplUpgrade zrepl_upgrade = 4;
    ZreplRemoveJobs zrepl_remove_jobs = 5;
    ZreplRestoreConfig zrepl_restore_config = 6;
    ZreplReleaseJobs zrepl_release_jobs = 7;
  }
}

// The Zrepl* actions take over an existing zrepl setup. See
// docs/design/replication.md, section 5.

// ZreplPreflight lists datasets' snapshots and bookmarks, and previews
// releasing an old job's holds and bookmarks. It changes nothing.
message ZreplPreflight {
  // Full dataset names on this host.
  repeated string datasets = 1;
  string release_job = 2;
}

message ZreplPreflightResult {
  string zrepl_version = 1;
  bool zrepl_running = 2;
  repeated DatasetSnapshots datasets = 3;
  // Output of `zrepl zfs-abstraction release-all --job <release_job>
  // --dry-run`, one line per hold or bookmark.
  repeated string release_preview = 4;
}

message DatasetSnapshots {
  string dataset = 1;
  bool exists = 2;
  uint64 referenced_bytes = 3;
  // Snapshots ("@name") and bookmarks ("#name"), oldest first.
  repeated SnapshotInfo snapshots = 4;
}

message SnapshotInfo {
  string name = 1;
  uint64 guid = 2;
  uint64 createtxg = 3;
}

// ZreplUpgrade installs the supported zrepl version (0.7) if an older one is
// installed.
message ZreplUpgrade {}

// ZreplRemoveJobs removes hand-written jobs from the main zrepl
// configuration, makes it include EZDR's jobs directory, and restarts zrepl.
// The main configuration is first copied to a backup named after backup,
// unless that backup already exists (so retries keep the original).
message ZreplRemoveJobs {
  repeated string jobs = 1;
  string backup = 2;
}

// ZreplRestoreConfig restores the main zrepl configuration from a backup made
// by ZreplRemoveJobs and restarts zrepl.
message ZreplRestoreConfig {
  string backup = 1;
}

// ZreplReleaseJobs releases the zrepl holds and bookmarks of removed jobs.
message ZreplReleaseJobs {
  repeated string jobs = 1;
}

// RefreshInventory asks the host to collect and report inventory now.
message RefreshInventory {}

message Heartbeat {}

// DesiredState is the full configuration the host should have.
message DesiredState {
  uint64 generation = 1;
  Zrepl zrepl = 2;
  // The host-to-host WireGuard tunnel for plans that use EZDR tunnels; unset
  // when none do (the interface is then removed).
  SiteTunnel site_tunnel = 3;
  // Primary: VMIDs whose configuration to report (guests of active and
  // paused plans), sorted.
  repeated uint32 report_guest_configs = 4;
  // DR host: the configuration of each active or paused plan's guests, to
  // keep for test failover and failover.
  repeated PlanGuestConfigs plan_guest_configs = 5;
}

// PlanGuestConfigs are one plan's guest configurations, as stored on the DR
// host.
message PlanGuestConfigs {
  string plan_id = 1;
  string plan_name = 2;
  string primary_hostname = 3;
  repeated GuestConfig guests = 4;
}

// GuestConfig is a guest's current Proxmox configuration file (without
// snapshot sections or pending changes).
message GuestConfig {
  uint32 vmid = 1;
  // "qemu" or "lxc".
  string type = 2;
  string config = 3;
  // When the primary first reported this configuration (set by the portal).
  google.protobuf.Timestamp changed_at = 4;
}

// SiteTunnel is the host's replication tunnel interface (ezdr1). Each
// replication partner is one peer.
message SiteTunnel {
  // The host's own tunnel address, such as "100.64.43.2".
  string address = 1;
  // The site tunnel range, for the client's overlap check.
  string prefix = 2;
  // UDP port to listen on; zero lets the kernel choose (the host only
  // connects out).
  uint32 listen_port = 3;
  repeated SitePeer peers = 4;
}

message SitePeer {
  bytes public_key = 1;
  // The peer's tunnel address; the only address allowed from it.
  string address = 2;
  // The peer's public endpoint as host:port, when this host connects to it;
  // empty when the peer connects to this host.
  string endpoint = 3;
  // Keepalive interval in seconds, set on the connecting side.
  uint32 persistent_keepalive_seconds = 4;
}

// Zrepl describes the zrepl jobs EZDR manages on the host. The client renders
// them into /etc/zrepl/ezdr.d/ezdr.yml. With no jobs, zrepl is not installed
// (or EZDR's jobs are removed if it is).
message Zrepl {
  repeated SourceJob source_jobs = 1;
  repeated PullJob pull_jobs = 2;
}

// Peer identifies the other end of a zrepl connection by its exact
// self-signed certificate.
message Peer {
  // Certificate common name, such as "ezdr-<host ID>".
  string name = 1;
  string certificate_pem = 2;
}

message SourceJob {
  string name = 1;
  // Exact datasets to snapshot and serve.
  repeated string datasets = 2;
  string snapshot_prefix = 3;
  uint32 interval_seconds = 4;
  // Address to listen on, as host:port; the host may be empty for all
  // addresses.
  string listen_address = 5;
  // The DR host allowed to connect.
  Peer peer = 6;
  // Raw sends, for encrypted datasets.
  bool encrypted = 7;
  // Bind even before the address exists (for tunnel addresses).
  bool listen_freebind = 8;
}

message PullJob {
  string name = 1;
  // The primary's source job address as host:port.
  string address = 2;
  Peer peer = 3;
  // Dataset replicas are received under (zrepl root_fs).
  string receive_dataset = 4;
  uint32 interval_seconds = 5;
  string snapshot_prefix = 6;
  repeated RetentionTier primary_retention = 7;
  repeated RetentionTier dr_retention = 8;
}

message RetentionTier {
  uint32 count = 1;
  uint32 period_seconds = 2;
  bool keep_all = 3;
}

message ReportStatusRequest {
  string client_version = 1;
  // The newest desired state generation the client has handled.
  uint64 applied_generation = 2;
  // Why applying that generation failed; empty on success.
  string apply_error = 3;
  // The host's zrepl TLS certificate (PEM), shared with its peers.
  string zrepl_certificate = 4;
  // Installed zrepl version; empty if not installed.
  string zrepl_version = 5;
  // The host's site tunnel WireGuard public key (32 bytes).
  bytes site_public_key = 6;
}

message ReportStatusResponse {}

message ReportInventoryRequest {
  ezdr.inventory.v1.Inventory inventory = 1;
}

message ReportInventoryResponse {}

message AckActionRequest {
  string action_id = 1;
  bool succeeded = 2;
  string message = 3;
  // Result of a ZreplPreflight action.
  ZreplPreflightResult preflight = 4;
  // Command output worth showing, such as released holds.
  repeated string output = 5;
}

message AckActionResponse {}

message ReportReplicationRequest {
  google.protobuf.Timestamp collected_at = 1;
  repeated JobStatus jobs = 2;
  // Set when zrepl's status could not be read at all.
  string error = 3;
}

message ReportReplicationResponse {}

message ReportGuestConfigsRequest {
  repeated GuestConfig guests = 1;
}

message ReportGuestConfigsResponse {}

// JobStatus is one of EZDR's zrepl jobs, from `zrepl status`.
message JobStatus {
  string name = 1;
  // "source" or "pull".
  string type = 2;
  // State of the latest replication attempt (pull jobs), such as "done",
  // "planning", or "replicating".
  string state = 3;
  google.protobuf.Timestamp attempt_started_at = 4;
  google.protobuf.Timestamp attempt_finished_at = 5;
  // Job-level problems: planning, connection, snapshotting, or pruning
  // errors.
  repeated string errors = 6;
  repeated DatasetStatus datasets = 7;
}

message DatasetStatus {
  // Source dataset name on the primary.
  string dataset = 1;
  // Newest snapshot with the plan's prefix present on this host (for pull
  // jobs: the newest replicated snapshot).
  string latest_snapshot = 2;
  google.protobuf.Timestamp latest_snapshot_at = 3;
  // State in the latest attempt, such as "done" or "stepping".
  string state = 4;
  string error = 5;
  uint64 bytes_expected = 6;
  uint64 bytes_replicated = 7;
  // The latest attempt sent the dataset in full rather than incrementally.
  bool full_send = 8;
}
