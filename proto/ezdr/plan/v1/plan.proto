syntax = "proto3";

package ezdr.plan.v1;

// PlanSpec is a DR plan's configuration. See docs/design/dr-plans.md.
message PlanSpec {
  string name = 1;
  string description = 2;
  string primary_host_id = 3;
  string dr_host_id = 4;
  repeated PlanGuest guests = 5;
  repeated StorageMapping storage_mappings = 6;
  repeated NetworkMapping network_mappings = 7;
  // DR bridge used for test failovers.
  string test_bridge = 8;
  // Snapshot interval in seconds.
  uint32 interval_seconds = 9;
  repeated RetentionTier primary_retention = 10;
  repeated RetentionTier dr_retention = 11;
  // Prefix of the snapshots this plan manages, such as "ezdr_".
  string snapshot_prefix = 12;
  // How the DR host reaches the primary's zrepl source jobs.
  ReplicationNetwork network = 13;
  // Alert when the newest replicated snapshot is older than this. Zero means
  // three times the snapshot interval.
  uint32 rpo_alert_seconds = 14;
  // Set when the plan takes over an existing hand-written zrepl setup:
  // activating it replaces these jobs instead of starting from scratch.
  ZreplTakeover takeover = 15;
  // Test failover guests use their VMID plus this offset. Zero means 10000.
  uint32 test_vmid_offset = 16;
  // A test failover ends automatically after this long. Zero means 8 hours.
  uint32 test_time_limit_seconds = 17;
}

// ZreplTakeover names the existing zrepl jobs a plan replaces. See
// docs/design/replication.md, section 5.
message ZreplTakeover {
  // The old source job on the primary.
  string source_job = 1;
  // The old pull job on the DR host.
  string pull_job = 2;
}

message ReplicationNetwork {
  oneof path {
    ExistingNetwork existing = 1;
    EzdrTunnel tunnel = 2;
  }
}

// ExistingNetwork replicates over a network the hosts can already use, such as
// a router site-to-site VPN.
message ExistingNetwork {
  // The primary's address as seen from the DR host (IP address or DNS name).
  string primary_address = 1;
  // First zrepl port. A plan uses one port per source job, counting up from
  // this one.
  uint32 port = 2;
  // Address the primary's zrepl listens on (an IP address). Empty means all
  // addresses.
  string listen_address = 3;
}

// EzdrTunnel replicates over an EZDR-managed WireGuard tunnel between the
// hosts.
message EzdrTunnel {
  enum Listener {
    LISTENER_UNSPECIFIED = 0;
    LISTENER_PRIMARY = 1;
    LISTENER_DR = 2;
  }
  // Which host accepts the WireGuard connection.
  Listener listener = 1;
  // The listening host's public endpoint as host:port.
  string endpoint = 2;
  // WireGuard UDP port on the listening host.
  uint32 listen_port = 3;
  // First zrepl port inside the tunnel.
  uint32 port = 4;
}

message PlanGuest {
  uint32 vmid = 1;
  // Guests start in ascending order at failover; equal orders start together.
  int32 startup_order = 2;
  // Seconds to wait after starting this guest before starting the next.
  uint32 startup_delay_seconds = 3;
  repeated DnsRecord dns_records = 4;
}

enum DnsRecordType {
  DNS_RECORD_TYPE_UNSPECIFIED = 0;
  DNS_RECORD_TYPE_A = 1;
  DNS_RECORD_TYPE_AAAA = 2;
  DNS_RECORD_TYPE_CNAME = 3;
  DNS_RECORD_TYPE_TXT = 4;
}

message DnsRecord {
  string name = 1;
  DnsRecordType type = 2;
  string production_value = 3;
  string failover_value = 4;
}

message StorageMapping {
  // Storage ID on the primary.
  string source_storage = 1;
  // ZFS storage ID on the DR host.
  string target_storage = 2;
  // Dataset on the DR host that replicas are received under. Replicas keep
  // their source path: <receive_dataset>/<source dataset>.
  string receive_dataset = 3;
}

message NetworkMapping {
  string source_bridge = 1;
  string target_bridge = 2;
}

// RetentionTier keeps one snapshot per period for count periods (zrepl grid
// "<count>x<period>"), or every snapshot within one period when keep_all is
// set ("1x<period>(keep=all)").
message RetentionTier {
  uint32 count = 1;
  uint32 period_seconds = 2;
  bool keep_all = 3;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
}

// Issue is a validation result. Errors block activation.
message Issue {
  Severity severity = 1;
  string message = 2;
  // Guest the issue is about, if any.
  uint32 vmid = 3;
}
