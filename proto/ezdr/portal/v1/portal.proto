syntax = "proto3";

package ezdr.portal.v1;

import "ezdr/inventory/v1/inventory.proto";
import "ezdr/plan/v1/plan.proto";
import "google/protobuf/timestamp.proto";

// SetupService creates the first administrator on a new portal.
service SetupService {
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse);
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);
}

message GetSetupStatusRequest {}

message GetSetupStatusResponse {
  bool setup_required = 1;
}

message CompleteSetupRequest {
  // One-time code printed in the portal log.
  string setup_code = 1;
  string username = 2;
  string password = 3;
}

message CompleteSetupResponse {}

// AuthService signs users in and out. Sign-in has two steps: password, then
// TOTP. Users without TOTP set up are given a secret to add to an
// authenticator app during their first sign-in.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyTotp(VerifyTotpRequest) returns (VerifyTotpResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  // Short-lived ID for the second sign-in step.
  string challenge_id = 1;
  // Set when the user must add TOTP to an authenticator app first.
  TotpSetup totp_setup = 2;
}

message TotpSetup {
  string secret = 1;
  // otpauth:// URL for QR codes.
  string url = 2;
}

message VerifyTotpRequest {
  string challenge_id = 1;
  // A 6-digit TOTP code or, for users with TOTP already set up, a recovery
  // code.
  string code = 2;
}

message VerifyTotpResponse {
  User user = 1;
  // Returned once, when TOTP is first set up.
  repeated string recovery_codes = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  // Unset when no one is signed in.
  User user = 1;
}

message User {
  string id = 1;
  string username = 2;
}

// TokenService manages enrollment tokens.
service TokenService {
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

message CreateTokenRequest {
  string description = 1;
  // Lifetime in seconds. Zero means the default (one hour).
  uint32 ttl_seconds = 2;
}

message CreateTokenResponse {
  EnrollmentToken token = 1;
  // The full token string. Shown only once.
  string token_string = 2;
  // Command that installs the client and enrolls the host.
  string install_command = 3;
  // Command for hosts that already have the client installed.
  string enroll_command = 4;
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated EnrollmentToken tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message RevokeTokenResponse {}

message EnrollmentToken {
  string id = 1;
  string description = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp used_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
  // Host enrolled with this token, if used.
  string host_id = 8;
}

// HostService lists and removes enrolled hosts.
service HostService {
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc DeleteHost(DeleteHostRequest) returns (DeleteHostResponse);
  rpc GetHostInventory(GetHostInventoryRequest) returns (GetHostInventoryResponse);
  // RefreshInventory asks an online host to report its inventory now.
  rpc RefreshInventory(RefreshInventoryRequest) returns (RefreshInventoryResponse);
}

message GetHostInventoryRequest {
  string host_id = 1;
}

message GetHostInventoryResponse {
  Host host = 1;
  // Unset until the host has reported inventory.
  ezdr.inventory.v1.Inventory inventory = 2;
  // When the inventory last differed from the previous report.
  google.protobuf.Timestamp changed_at = 3;
  // When the portal last received a report.
  google.protobuf.Timestamp received_at = 4;
  // Plans protecting this host's guests: VMID to plan.
  map<uint32, PlanRef> guest_plans = 5;
}

message PlanRef {
  string id = 1;
  string name = 2;
}

message RefreshInventoryRequest {
  string host_id = 1;
}

message RefreshInventoryResponse {}

message ListHostsRequest {}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message DeleteHostRequest {
  string id = 1;
}

message DeleteHostResponse {}

message Host {
  string id = 1;
  string hostname = 2;
  string machine_id = 3;
  string pve_version = 4;
  string client_version = 5;
  string tunnel_address = 6;
  google.protobuf.Timestamp enrolled_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  bool online = 9;
  // Set when another host was enrolled with the same machine ID.
  bool duplicate_machine_id = 10;
  // From the latest inventory; zero until inventory is reported.
  uint32 guest_count = 11;
  uint32 guests_not_ready = 12;
  bool has_inventory = 13;
  // Plans that use this host as primary or DR host.
  uint32 plan_count = 14;
}

// AuditService lists audit log entries, newest first.
service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

message ListAuditEventsRequest {
  uint32 limit = 1;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
}

message AuditEvent {
  google.protobuf.Timestamp time = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string source_address = 5;
  string detail = 6;
}

// PlanService manages DR plans.
service PlanService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse);
  // ValidatePlan checks a specification without saving it.
  rpc ValidatePlan(ValidatePlanRequest) returns (ValidatePlanResponse);
  // SuggestPlan fills in missing mappings, startup order, and defaults.
  rpc SuggestPlan(SuggestPlanRequest) returns (SuggestPlanResponse);
  // PreviewPlanChanges lists what activating or applying the plan's
  // editing specification would change on each host.
  rpc PreviewPlanChanges(PreviewPlanChangesRequest) returns (PreviewPlanChangesResponse);
  // ActivatePlan applies a valid draft to its hosts.
  rpc ActivatePlan(ActivatePlanRequest) returns (ActivatePlanResponse);
  // ApplyPlanChanges applies an active plan's pending changes.
  rpc ApplyPlanChanges(ApplyPlanChangesRequest) returns (ApplyPlanChangesResponse);
  // DiscardPlanChanges reverts pending changes to the applied specification.
  rpc DiscardPlanChanges(DiscardPlanChangesRequest) returns (DiscardPlanChangesResponse);
  rpc PausePlan(PausePlanRequest) returns (PausePlanResponse);
  rpc ResumePlan(ResumePlanRequest) returns (ResumePlanResponse);
  // DeactivatePlan removes the plan's jobs from its hosts and returns it to
  // draft. Replicas and snapshots are kept.
  rpc DeactivatePlan(DeactivatePlanRequest) returns (DeactivatePlanResponse);
}

message HostChanges {
  string host_id = 1;
  string hostname = 2;
  repeated string changes = 3;
}

message PreviewPlanChangesRequest {
  string id = 1;
}

message PreviewPlanChangesResponse {
  repeated HostChanges hosts = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message ActivatePlanRequest {
  string id = 1;
}

message ActivatePlanResponse {
  Plan plan = 1;
}

message ApplyPlanChangesRequest {
  string id = 1;
}

message ApplyPlanChangesResponse {
  Plan plan = 1;
}

message DiscardPlanChangesRequest {
  string id = 1;
}

message DiscardPlanChangesResponse {
  Plan plan = 1;
}

message PausePlanRequest {
  string id = 1;
}

message PausePlanResponse {
  Plan plan = 1;
}

message ResumePlanRequest {
  string id = 1;
}

message ResumePlanResponse {
  Plan plan = 1;
}

message DeactivatePlanRequest {
  string id = 1;
}

message DeactivatePlanResponse {
  Plan plan = 1;
}

enum PlanState {
  PLAN_STATE_UNSPECIFIED = 0;
  PLAN_STATE_DRAFT = 1;
  PLAN_STATE_ACTIVE = 2;
  PLAN_STATE_PAUSED = 3;
}

message Plan {
  string id = 1;
  // The editing specification.
  ezdr.plan.v1.PlanSpec spec = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  PlanState state = 6;
  // The specification applied to the hosts; unset for drafts.
  ezdr.plan.v1.PlanSpec applied_spec = 7;
  google.protobuf.Timestamp applied_at = 8;
  // True when an active or paused plan has edits not yet applied.
  bool pending_changes = 9;
  // Per-host progress applying the plan's configuration.
  repeated HostApplyStatus hosts = 10;
}

message HostApplyStatus {
  string host_id = 1;
  string hostname = 2;
  bool online = 3;
  // True once the host has applied its latest configuration.
  bool applied = 4;
  string apply_error = 5;
  string zrepl_version = 6;
  bool has_certificate = 7;
}

message PlanSummary {
  string id = 1;
  string name = 2;
  string primary_hostname = 3;
  string dr_hostname = 4;
  uint32 guest_count = 5;
  uint32 interval_seconds = 6;
  uint32 error_count = 7;
  uint32 warning_count = 8;
  PlanState state = 9;
  bool pending_changes = 10;
}

message ListPlansRequest {}

message ListPlansResponse {
  repeated PlanSummary plans = 1;
}

message GetPlanRequest {
  string id = 1;
}

message GetPlanResponse {
  Plan plan = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message CreatePlanRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
}

message CreatePlanResponse {
  Plan plan = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message UpdatePlanRequest {
  string id = 1;
  ezdr.plan.v1.PlanSpec spec = 2;
}

message UpdatePlanResponse {
  Plan plan = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message DeletePlanRequest {
  string id = 1;
}

message DeletePlanResponse {}

message ValidatePlanRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
  // The plan being edited, if it exists, so its own guests don't count as
  // protected by another plan.
  string plan_id = 2;
}

message ValidatePlanResponse {
  repeated ezdr.plan.v1.Issue issues = 1;
}

message SuggestPlanRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
}

message SuggestPlanResponse {
  ezdr.plan.v1.PlanSpec spec = 1;
}
