syntax = "proto3";

package ezdr.portal.v1;

import "ezdr/inventory/v1/inventory.proto";
import "ezdr/plan/v1/plan.proto";
import "google/protobuf/timestamp.proto";

// SetupService creates the first administrator on a new portal.
service SetupService {
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse);
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);
}

message GetSetupStatusRequest {}

message GetSetupStatusResponse {
  bool setup_required = 1;
}

message CompleteSetupRequest {
  // One-time code printed in the portal log.
  string setup_code = 1;
  string username = 2;
  string password = 3;
}

message CompleteSetupResponse {}

// AuthService signs users in and out. Sign-in has two steps: password, then
// TOTP. Users without TOTP set up are given a secret to add to an
// authenticator app during their first sign-in.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyTotp(VerifyTotpRequest) returns (VerifyTotpResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  // Short-lived ID for the second sign-in step.
  string challenge_id = 1;
  // Set when the user must add TOTP to an authenticator app first.
  TotpSetup totp_setup = 2;
}

message TotpSetup {
  string secret = 1;
  // otpauth:// URL for QR codes.
  string url = 2;
}

message VerifyTotpRequest {
  string challenge_id = 1;
  // A 6-digit TOTP code or, for users with TOTP already set up, a recovery
  // code.
  string code = 2;
}

message VerifyTotpResponse {
  User user = 1;
  // Returned once, when TOTP is first set up.
  repeated string recovery_codes = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  // Unset when no one is signed in.
  User user = 1;
}

message User {
  string id = 1;
  string username = 2;
}

// TokenService manages enrollment tokens.
service TokenService {
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

message CreateTokenRequest {
  string description = 1;
  // Lifetime in seconds. Zero means the default (one hour).
  uint32 ttl_seconds = 2;
}

message CreateTokenResponse {
  EnrollmentToken token = 1;
  // The full token string. Shown only once.
  string token_string = 2;
  // Command that installs the client and enrolls the host.
  string install_command = 3;
  // Command for hosts that already have the client installed.
  string enroll_command = 4;
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated EnrollmentToken tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message RevokeTokenResponse {}

message EnrollmentToken {
  string id = 1;
  string description = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp used_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
  // Host enrolled with this token, if used.
  string host_id = 8;
}

// HostService lists and removes enrolled hosts.
service HostService {
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc DeleteHost(DeleteHostRequest) returns (DeleteHostResponse);
  rpc GetHostInventory(GetHostInventoryRequest) returns (GetHostInventoryResponse);
  // RefreshInventory asks an online host to report its inventory now.
  rpc RefreshInventory(RefreshInventoryRequest) returns (RefreshInventoryResponse);
}

message GetHostInventoryRequest {
  string host_id = 1;
}

message GetHostInventoryResponse {
  Host host = 1;
  // Unset until the host has reported inventory.
  ezdr.inventory.v1.Inventory inventory = 2;
  // When the inventory last differed from the previous report.
  google.protobuf.Timestamp changed_at = 3;
  // When the portal last received a report.
  google.protobuf.Timestamp received_at = 4;
  // Plans protecting this host's guests: VMID to plan.
  map<uint32, PlanRef> guest_plans = 5;
}

message PlanRef {
  string id = 1;
  string name = 2;
}

message RefreshInventoryRequest {
  string host_id = 1;
}

message RefreshInventoryResponse {}

message ListHostsRequest {}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message DeleteHostRequest {
  string id = 1;
}

message DeleteHostResponse {}

message Host {
  string id = 1;
  string hostname = 2;
  string machine_id = 3;
  string pve_version = 4;
  string client_version = 5;
  string tunnel_address = 6;
  google.protobuf.Timestamp enrolled_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  bool online = 9;
  // Set when another host was enrolled with the same machine ID.
  bool duplicate_machine_id = 10;
  // From the latest inventory; zero until inventory is reported.
  uint32 guest_count = 11;
  uint32 guests_not_ready = 12;
  bool has_inventory = 13;
  // Plans that use this host as primary or DR host.
  uint32 plan_count = 14;
}

// AuditService lists audit log entries, newest first.
service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

message ListAuditEventsRequest {
  uint32 limit = 1;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
}

message AuditEvent {
  google.protobuf.Timestamp time = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string source_address = 5;
  string detail = 6;
}

// PlanService manages DR plans.
service PlanService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse);
  // ValidatePlan checks a specification without saving it.
  rpc ValidatePlan(ValidatePlanRequest) returns (ValidatePlanResponse);
  // SuggestPlan fills in missing mappings, startup order, and defaults.
  rpc SuggestPlan(SuggestPlanRequest) returns (SuggestPlanResponse);
  // ListZreplSetups lists existing hand-written zrepl setups between a plan's
  // hosts that the plan could adopt.
  rpc ListZreplSetups(ListZreplSetupsRequest) returns (ListZreplSetupsResponse);
  // AdoptZreplSetup fills in a specification from an existing zrepl setup,
  // without saving it.
  rpc AdoptZreplSetup(AdoptZreplSetupRequest) returns (AdoptZreplSetupResponse);
  // RunTakeoverPreflight checks, on both hosts, that an adopted plan can take
  // over its zrepl setup, and stores the result. It changes nothing on the
  // hosts.
  rpc RunTakeoverPreflight(RunTakeoverPreflightRequest) returns (RunTakeoverPreflightResponse);
  // GetTakeover returns an adopted plan's latest preflight and takeover
  // progress.
  rpc GetTakeover(GetTakeoverRequest) returns (GetTakeoverResponse);
  // StartTakeover takes over the zrepl setup after a recent preflight without
  // problems. It returns once the takeover has started; GetTakeover shows its
  // progress. On success the plan becomes active.
  rpc StartTakeover(StartTakeoverRequest) returns (StartTakeoverResponse);
  // RetryTakeoverRollback runs the rollback of a failed takeover again, for
  // example once an offline host is back.
  rpc RetryTakeoverRollback(RetryTakeoverRollbackRequest) returns (RetryTakeoverRollbackResponse);
  // PreviewPlanChanges lists what activating or applying the plan's
  // editing specification would change on each host.
  rpc PreviewPlanChanges(PreviewPlanChangesRequest) returns (PreviewPlanChangesResponse);
  // ActivatePlan applies a valid draft to its hosts.
  rpc ActivatePlan(ActivatePlanRequest) returns (ActivatePlanResponse);
  // ApplyPlanChanges applies an active plan's pending changes.
  rpc ApplyPlanChanges(ApplyPlanChangesRequest) returns (ApplyPlanChangesResponse);
  // DiscardPlanChanges reverts pending changes to the applied specification.
  rpc DiscardPlanChanges(DiscardPlanChangesRequest) returns (DiscardPlanChangesResponse);
  rpc PausePlan(PausePlanRequest) returns (PausePlanResponse);
  rpc ResumePlan(ResumePlanRequest) returns (ResumePlanResponse);
  // DeactivatePlan removes the plan's jobs from its hosts and returns it to
  // draft. Replicas and snapshots are kept.
  rpc DeactivatePlan(DeactivatePlanRequest) returns (DeactivatePlanResponse);
  // GetPlanStatus returns an active plan's replication health.
  rpc GetPlanStatus(GetPlanStatusRequest) returns (GetPlanStatusResponse);
}

// FailoverService fails plans over to their DR hosts. See
// docs/design/failover.md.
service FailoverService {
  // GetFailoverOptions returns what a failover of the plan would involve.
  rpc GetFailoverOptions(GetFailoverOptionsRequest) returns (GetFailoverOptionsResponse);
  rpc StartFailover(StartFailoverRequest) returns (StartFailoverResponse);
  // GetFailover returns the plan's latest failover, if any.
  rpc GetFailover(GetFailoverRequest) returns (GetFailoverResponse);
  // ConfirmFailover records that the operator verified the guests on the DR
  // host, and switches DNS if asked.
  rpc ConfirmFailover(ConfirmFailoverRequest) returns (ConfirmFailoverResponse);
  // RetryFailover runs a failed step of a committed failover again.
  rpc RetryFailover(RetryFailoverRequest) returns (RetryFailoverResponse);
  // RunFailbackPreflight checks what failing a failed-over plan back would
  // do. See docs/design/failback.md.
  rpc RunFailbackPreflight(RunFailbackPreflightRequest) returns (RunFailbackPreflightResponse);
  // StartFailback starts failing a failed-over plan back to its primary.
  rpc StartFailback(StartFailbackRequest) returns (StartFailbackResponse);
  // GetFailback returns the plan's latest failback, if any.
  rpc GetFailback(GetFailbackRequest) returns (GetFailbackResponse);
  // ConfirmFailback records that the operator verified the guests on the
  // primary, and switches DNS back if asked.
  rpc ConfirmFailback(ConfirmFailbackRequest) returns (ConfirmFailbackResponse);
  // RetryFailback runs a failed step of a committed failback again.
  rpc RetryFailback(RetryFailbackRequest) returns (RetryFailbackResponse);
}

message GetFailoverOptionsRequest {
  string plan_id = 1;
}

message GetFailoverOptionsResponse {
  bool primary_online = 1;
  bool dr_online = 2;
  // A planned failover needs an active plan and a reachable primary.
  bool planned_possible = 3;
  // The newest snapshot the DR host has for every guest: what an unplanned
  // failover starts from.
  google.protobuf.Timestamp newest_snapshot_at = 4;
  repeated TestGuestOption guests = 5;
  repeated DnsRecordSwitch dns_records = 6;
  // Why the plan can't fail over now; empty if it can.
  string problem = 7;
}

message StartFailoverRequest {
  string plan_id = 1;
  bool planned = 2;
  // The plan's name, typed by the operator to confirm.
  string confirm_name = 3;
}

message StartFailoverResponse {
  Failover failover = 1;
}

message GetFailoverRequest {
  string plan_id = 1;
}

message GetFailoverResponse {
  Failover failover = 1;
}

message ConfirmFailoverRequest {
  string plan_id = 1;
  bool switch_dns = 2;
}

message ConfirmFailoverResponse {
  Failover failover = 1;
}

message RetryFailoverRequest {
  string plan_id = 1;
}

message RetryFailoverResponse {
  Failover failover = 1;
}

enum FailoverState {
  FAILOVER_STATE_UNSPECIFIED = 0;
  FAILOVER_STATE_RUNNING = 1;
  // The guests run on the DR host; waiting for the operator to verify them.
  FAILOVER_STATE_AWAITING_CONFIRMATION = 2;
  FAILOVER_STATE_COMPLETED = 3;
  // A planned failover failed before replication stopped; the primary's
  // guests were started again and the plan is unchanged.
  FAILOVER_STATE_ABORTED = 4;
  // A step after replication stopped failed; it can be retried.
  FAILOVER_STATE_FAILED = 5;
}

message Failover {
  string id = 1;
  string plan_id = 2;
  bool planned = 3;
  FailoverState state = 4;
  string started_by = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  // The final snapshot (planned failovers).
  string snapshot = 8;
  repeated TakeoverStep steps = 9;
  repeated TestRunGuest guests = 10;
  repeated DnsRecordSwitch dns_records = 11;
  string error = 12;
  repeated string notes = 13;
  // Set for failovers run on the DR host's command line (break-glass).
  bool break_glass = 14;
}

message RunFailbackPreflightRequest {
  string plan_id = 1;
}

message RunFailbackPreflightResponse {
  FailbackPreflight preflight = 1;
}

// FailbackPreflight is what failing back would do, from both hosts' current
// snapshots and inventories.
message FailbackPreflight {
  google.protobuf.Timestamp checked_at = 1;
  repeated FailbackDataset datasets = 2;
  // Whether any dataset on the primary changed after its common snapshot;
  // failing back discards those changes, which the operator confirms.
  bool diverged = 3;
  // Configuration changes made at the DR site that failing back doesn't
  // carry over: the primary keeps its own configuration.
  repeated string config_changes = 4;
  // Problems that block the failback.
  repeated string problems = 5;
  // Concerns that don't block it.
  repeated string warnings = 6;
}

message FailbackDataset {
  // Dataset on the primary.
  string dataset = 1;
  // Its replica on the DR host.
  string replica = 2;
  // Newest snapshot both hosts have; the copy starts from it. Empty if
  // there's none.
  string common_snapshot = 3;
  // About how much the DR host has written since the common snapshot.
  uint64 copy_bytes = 4;
  // Changes on the primary after the common snapshot, which failing back
  // discards: newer snapshots, and the space written after the common
  // snapshot.
  repeated string discarded_snapshots = 5;
  uint64 diverged_bytes = 6;
}

message StartFailbackRequest {
  string plan_id = 1;
  // The plan's name, typed by the operator to confirm.
  string confirm_name = 2;
  // Confirms discarding the primary's diverged data, when the preflight
  // finds some.
  bool discard_diverged = 3;
}

message StartFailbackResponse {
  Failback failback = 1;
}

message GetFailbackRequest {
  string plan_id = 1;
}

message GetFailbackResponse {
  Failback failback = 1;
}

message ConfirmFailbackRequest {
  string plan_id = 1;
  bool switch_dns = 2;
}

message ConfirmFailbackResponse {
  Failback failback = 1;
}

message RetryFailbackRequest {
  string plan_id = 1;
}

message RetryFailbackResponse {
  Failback failback = 1;
}

enum FailbackState {
  FAILBACK_STATE_UNSPECIFIED = 0;
  FAILBACK_STATE_RUNNING = 1;
  // The guests run on the primary; waiting for the operator to verify them.
  FAILBACK_STATE_AWAITING_CONFIRMATION = 2;
  FAILBACK_STATE_COMPLETED = 3;
  // A step before the DR host's cleanup failed; the guests run on the DR
  // host again and the plan is still failed over.
  FAILBACK_STATE_ABORTED = 4;
  // A step from the DR host's cleanup on failed; it can be retried.
  FAILBACK_STATE_FAILED = 5;
}

message Failback {
  string id = 1;
  string plan_id = 2;
  FailbackState state = 3;
  string started_by = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  // The preflight the failback started from.
  FailbackPreflight preflight = 7;
  bool discard_diverged = 8;
  repeated TakeoverStep steps = 9;
  repeated FailbackRound rounds = 10;
  // The newest snapshot each dataset on the primary received (dataset to
  // snapshot name, without "@").
  map<string, string> synced = 11;
  // The snapshot of the round in progress, kept so a repeated round reuses
  // it.
  string pending_snapshot = 12;
  repeated TestRunGuest guests = 13;
  repeated DnsRecordSwitch dns_records = 14;
  string error = 15;
  repeated string notes = 16;
}

// FailbackRound is one copy of the DR host's changes to the primary.
message FailbackRound {
  string snapshot = 1;
  uint64 bytes = 2;
  google.protobuf.Timestamp completed_at = 3;
  // The copy after the guests on the DR host stopped.
  bool final = 4;
}

// DnsRecordSwitch is a DNS record a failover switches.
message DnsRecordSwitch {
  uint32 vmid = 1;
  string name = 2;
  string type = 3;
  string production_value = 4;
  string failover_value = 5;
  // "pending", "switched", "failed", or "skipped".
  string status = 6;
  string detail = 7;
}

// DnsService connects the portal to a DNS provider (Cloudflare) and reports
// the state of plans' DNS records. See docs/design/failover.md, section 6.
service DnsService {
  rpc GetDnsSettings(GetDnsSettingsRequest) returns (GetDnsSettingsResponse);
  rpc UpdateDnsSettings(UpdateDnsSettingsRequest) returns (UpdateDnsSettingsResponse);
  // TestDnsSettings lists the zones the stored token can see.
  rpc TestDnsSettings(TestDnsSettingsRequest) returns (TestDnsSettingsResponse);
  // GetPlanDnsStatus returns the plan's records as last checked.
  rpc GetPlanDnsStatus(GetPlanDnsStatusRequest) returns (GetPlanDnsStatusResponse);
  // CheckPlanDns checks the plan's records now.
  rpc CheckPlanDns(CheckPlanDnsRequest) returns (CheckPlanDnsResponse);
}

message GetDnsSettingsRequest {}

message GetDnsSettingsResponse {
  bool cloudflare_token_set = 1;
}

message UpdateDnsSettingsRequest {
  // A new Cloudflare API token; empty keeps the current one unless clear is
  // set.
  string cloudflare_token = 1;
  bool clear = 2;
}

message UpdateDnsSettingsResponse {}

message TestDnsSettingsRequest {}

message TestDnsSettingsResponse {
  repeated string zones = 1;
}

message GetPlanDnsStatusRequest {
  string plan_id = 1;
}

message GetPlanDnsStatusResponse {
  PlanDnsStatus status = 1;
}

message CheckPlanDnsRequest {
  string plan_id = 1;
}

message CheckPlanDnsResponse {
  PlanDnsStatus status = 1;
}

// PlanDnsStatus is a plan's DNS records as last read from the provider.
message PlanDnsStatus {
  google.protobuf.Timestamp checked_at = 1;
  repeated DnsRecordStatus records = 2;
  // Why the records couldn't be checked at all.
  string error = 3;
}

message DnsRecordStatus {
  uint32 vmid = 1;
  string name = 2;
  string type = 3;
  // The value expected for the plan's state; empty when not checked (for
  // example, the DNS switch was skipped during failover).
  string expected = 4;
  string current = 5;
  uint32 ttl = 6;
  bool proxied = 7;
  string zone = 8;
  // Problems, such as a mismatch (drift), a missing record, or a long TTL.
  repeated string problems = 9;
  // Whether the current value doesn't match the expected one.
  bool drift = 10;
}

// TestFailoverService runs test failovers. See docs/design/test-failover.md.
service TestFailoverService {
  // GetTestOptions asks the DR host which guests can be tested and from
  // which points in time.
  rpc GetTestOptions(GetTestOptionsRequest) returns (GetTestOptionsResponse);
  rpc StartTest(StartTestRequest) returns (StartTestResponse);
  rpc GetTest(GetTestRequest) returns (GetTestResponse);
  // ListTests returns a plan's tests, newest first.
  rpc ListTests(ListTestsRequest) returns (ListTestsResponse);
  // ExtendTest adds the plan's time limit to a running test's deadline.
  rpc ExtendTest(ExtendTestRequest) returns (ExtendTestResponse);
  // EndTest stops and removes the test guests.
  rpc EndTest(EndTestRequest) returns (EndTestResponse);
  rpc SetTestVerdict(SetTestVerdictRequest) returns (SetTestVerdictResponse);
}

message GetTestOptionsRequest {
  string plan_id = 1;
}

message GetTestOptionsResponse {
  repeated TestGuestOption guests = 1;
  // Points in time every testable guest has, newest first.
  repeated TestPointInTime points_in_time = 2;
  uint64 memory_available_bytes = 3;
}

message TestGuestOption {
  uint32 vmid = 1;
  uint32 test_vmid = 2;
  string name = 3;
  string type = 4;
  uint64 memory_bytes = 5;
  int32 startup_order = 6;
  // Why the guest can't be tested now; empty if it can.
  string problem = 7;
  // When the DR host's copy of its configuration last changed.
  google.protobuf.Timestamp config_changed_at = 8;
}

message TestPointInTime {
  string snapshot = 1;
  google.protobuf.Timestamp created_at = 2;
}

message StartTestRequest {
  string plan_id = 1;
  repeated uint32 vmids = 2;
  string snapshot = 3;
}

message StartTestResponse {
  TestRun test = 1;
}

message GetTestRequest {
  string id = 1;
}

message GetTestResponse {
  TestRun test = 1;
}

message ListTestsRequest {
  string plan_id = 1;
}

message ListTestsResponse {
  repeated TestRun tests = 1;
}

message ExtendTestRequest {
  string id = 1;
}

message ExtendTestResponse {
  TestRun test = 1;
}

message EndTestRequest {
  string id = 1;
}

message EndTestResponse {
  TestRun test = 1;
}

message SetTestVerdictRequest {
  string id = 1;
  TestVerdict verdict = 2;
  string notes = 3;
}

message SetTestVerdictResponse {
  TestRun test = 1;
}

enum TestState {
  TEST_STATE_UNSPECIFIED = 0;
  // Cloning, registering, and starting the guests.
  TEST_STATE_STARTING = 1;
  TEST_STATE_RUNNING = 2;
  // Removing the test guests and clones.
  TEST_STATE_ENDING = 3;
  TEST_STATE_ENDED = 4;
  // Setting up failed; the test was cleaned up.
  TEST_STATE_FAILED = 5;
}

enum TestVerdict {
  TEST_VERDICT_UNSPECIFIED = 0;
  TEST_VERDICT_PASSED = 1;
  TEST_VERDICT_FAILED = 2;
}

// TestRun is one test failover of a plan.
message TestRun {
  string id = 1;
  string plan_id = 2;
  string plan_name = 3;
  TestState state = 4;
  string snapshot = 5;
  google.protobuf.Timestamp snapshot_at = 6;
  string started_by = 7;
  google.protobuf.Timestamp started_at = 8;
  // When the test ends by itself.
  google.protobuf.Timestamp deadline = 9;
  google.protobuf.Timestamp ended_at = 10;
  // Who ended it, or "time limit".
  string ended_by = 11;
  repeated TestRunGuest guests = 12;
  repeated TakeoverStep steps = 13;
  // Why setting up or cleaning up failed.
  string error = 14;
  // Settings removed from guests' configurations, such as passthrough.
  repeated string notes = 15;
  TestVerdict verdict = 16;
  string verdict_notes = 17;
  string verdict_by = 18;
  google.protobuf.Timestamp verdict_at = 19;
}

message TestRunGuest {
  uint32 vmid = 1;
  uint32 test_vmid = 2;
  string name = 3;
  string type = 4;
  // "pending", "starting", "running", or "failed".
  string status = 5;
  bool agent_enabled = 6;
  bool agent_ok = 7;
  string detail = 8;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  // Not active, so no health.
  HEALTH_STATE_NONE = 1;
  HEALTH_STATE_HEALTHY = 2;
  // The initial replication is still running.
  HEALTH_STATE_SYNCING = 3;
  // The newest replicated snapshot is older than the RPO alert threshold.
  HEALTH_STATE_LAGGING = 4;
  // zrepl reports errors.
  HEALTH_STATE_FAILING = 5;
  // A host is offline or hasn't reported status recently.
  HEALTH_STATE_UNKNOWN = 6;
}

message PlanHealth {
  HealthState state = 1;
  string message = 2;
  // Age of the oldest dataset's newest replicated snapshot, in seconds.
  uint64 rpo_age_seconds = 3;
  uint64 rpo_alert_seconds = 4;
  google.protobuf.Timestamp last_replication_at = 5;
}

message DatasetHealth {
  string dataset = 1;
  string latest_snapshot = 2;
  google.protobuf.Timestamp latest_snapshot_at = 3;
  uint64 age_seconds = 4;
  string state = 5;
  string error = 6;
  uint64 bytes_expected = 7;
  uint64 bytes_replicated = 8;
}

message GetPlanStatusRequest {
  string id = 1;
}

message GetPlanStatusResponse {
  PlanHealth health = 1;
  repeated DatasetHealth datasets = 2;
  // Job-level errors reported by either host.
  repeated string errors = 3;
}

// AlertService manages alert channels and lists alerts.
service AlertService {
  rpc GetAlertSettings(GetAlertSettingsRequest) returns (GetAlertSettingsResponse);
  rpc UpdateAlertSettings(UpdateAlertSettingsRequest) returns (UpdateAlertSettingsResponse);
  // SendTestAlert sends a test notification to every configured channel.
  rpc SendTestAlert(SendTestAlertRequest) returns (SendTestAlertResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
}

enum SmtpSecurity {
  SMTP_SECURITY_UNSPECIFIED = 0;
  // STARTTLS on the submission port (usually 587).
  SMTP_SECURITY_STARTTLS = 1;
  // Implicit TLS (usually port 465).
  SMTP_SECURITY_TLS = 2;
  // No encryption; only for trusted local relays.
  SMTP_SECURITY_NONE = 3;
}

message SmtpSettings {
  bool enabled = 1;
  string host = 2;
  uint32 port = 3;
  SmtpSecurity security = 4;
  string username = 5;
  // Write-only: never returned. Empty on update keeps the stored password.
  string password = 6;
  // Returned on read: whether a password is stored.
  bool has_password = 7;
  string from = 8;
  repeated string recipients = 9;
}

message Webhook {
  string url = 1;
  // Write-only; empty on update keeps the stored secret.
  string secret = 2;
  bool has_secret = 3;
  // Set to remove the stored secret.
  bool clear_secret = 4;
}

message AlertSettings {
  SmtpSettings smtp = 1;
  repeated Webhook webhooks = 2;
}

message GetAlertSettingsRequest {}

message GetAlertSettingsResponse {
  AlertSettings settings = 1;
}

message UpdateAlertSettingsRequest {
  AlertSettings settings = 1;
}

message UpdateAlertSettingsResponse {
  AlertSettings settings = 1;
}

message SendTestAlertRequest {}

message SendTestAlertResponse {
  // One line per channel: what was sent or why it failed.
  repeated string results = 1;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_WARNING = 1;
  ALERT_SEVERITY_CRITICAL = 2;
}

message Alert {
  string key = 1;
  AlertSeverity severity = 2;
  string title = 3;
  string message = 4;
  string plan_id = 5;
  string host_id = 6;
  google.protobuf.Timestamp fired_at = 7;
  // Unset while the alert is firing.
  google.protobuf.Timestamp resolved_at = 8;
}

message ListAlertsRequest {
  uint32 limit = 1;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

message HostChanges {
  string host_id = 1;
  string hostname = 2;
  repeated string changes = 3;
}

message PreviewPlanChangesRequest {
  string id = 1;
}

message PreviewPlanChangesResponse {
  repeated HostChanges hosts = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message ActivatePlanRequest {
  string id = 1;
}

message ActivatePlanResponse {
  Plan plan = 1;
}

message ApplyPlanChangesRequest {
  string id = 1;
}

message ApplyPlanChangesResponse {
  Plan plan = 1;
}

message DiscardPlanChangesRequest {
  string id = 1;
}

message DiscardPlanChangesResponse {
  Plan plan = 1;
}

message PausePlanRequest {
  string id = 1;
}

message PausePlanResponse {
  Plan plan = 1;
}

message ResumePlanRequest {
  string id = 1;
}

message ResumePlanResponse {
  Plan plan = 1;
}

message DeactivatePlanRequest {
  string id = 1;
}

message DeactivatePlanResponse {
  Plan plan = 1;
}

enum PlanState {
  PLAN_STATE_UNSPECIFIED = 0;
  PLAN_STATE_DRAFT = 1;
  PLAN_STATE_ACTIVE = 2;
  PLAN_STATE_PAUSED = 3;
  // A failover is running.
  PLAN_STATE_FAILING_OVER = 4;
  // The guests run on the DR host; replication is stopped.
  PLAN_STATE_FAILED_OVER = 5;
  // A failback is running.
  PLAN_STATE_FAILING_BACK = 6;
}

message Plan {
  string id = 1;
  // The editing specification.
  ezdr.plan.v1.PlanSpec spec = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  PlanState state = 6;
  // The specification applied to the hosts; unset for drafts.
  ezdr.plan.v1.PlanSpec applied_spec = 7;
  google.protobuf.Timestamp applied_at = 8;
  // True when an active or paused plan has edits not yet applied.
  bool pending_changes = 9;
  // Per-host progress applying the plan's configuration.
  repeated HostApplyStatus hosts = 10;
}

message HostApplyStatus {
  string host_id = 1;
  string hostname = 2;
  bool online = 3;
  // True once the host has applied its latest configuration.
  bool applied = 4;
  string apply_error = 5;
  string zrepl_version = 6;
  bool has_certificate = 7;
}

message PlanSummary {
  string id = 1;
  string name = 2;
  string primary_hostname = 3;
  string dr_hostname = 4;
  uint32 guest_count = 5;
  uint32 interval_seconds = 6;
  uint32 error_count = 7;
  uint32 warning_count = 8;
  PlanState state = 9;
  bool pending_changes = 10;
  PlanHealth health = 11;
}

message ListPlansRequest {}

message ListPlansResponse {
  repeated PlanSummary plans = 1;
}

message GetPlanRequest {
  string id = 1;
}

message GetPlanResponse {
  Plan plan = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message CreatePlanRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
}

message CreatePlanResponse {
  Plan plan = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message UpdatePlanRequest {
  string id = 1;
  ezdr.plan.v1.PlanSpec spec = 2;
}

message UpdatePlanResponse {
  Plan plan = 1;
  repeated ezdr.plan.v1.Issue issues = 2;
}

message DeletePlanRequest {
  string id = 1;
}

message DeletePlanResponse {}

message ValidatePlanRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
  // The plan being edited, if it exists, so its own guests don't count as
  // protected by another plan.
  string plan_id = 2;
}

message ValidatePlanResponse {
  repeated ezdr.plan.v1.Issue issues = 1;
}

message SuggestPlanRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
}

message SuggestPlanResponse {
  ezdr.plan.v1.PlanSpec spec = 1;
}

message ListZreplSetupsRequest {
  string primary_host_id = 1;
  string dr_host_id = 2;
}

message ListZreplSetupsResponse {
  repeated ZreplSetup setups = 1;
}

// ZreplSetup is a hand-written source job on the primary and the pull job on
// the DR host that connects to it.
message ZreplSetup {
  ezdr.inventory.v1.ZreplJob source_job = 1;
  ezdr.inventory.v1.ZreplJob pull_job = 2;
}

message AdoptZreplSetupRequest {
  ezdr.plan.v1.PlanSpec spec = 1;
  string source_job = 2;
  string pull_job = 3;
}

message AdoptZreplSetupResponse {
  ezdr.plan.v1.PlanSpec spec = 1;
  // What the plan does differently from the old setup, such as guests whose
  // disks were only partly replicated.
  repeated string notes = 2;
}

message RunTakeoverPreflightRequest {
  string id = 1;
}

message RunTakeoverPreflightResponse {
  Takeover takeover = 1;
}

message StartTakeoverRequest {
  string id = 1;
}

message StartTakeoverResponse {
  Takeover takeover = 1;
}

message RetryTakeoverRollbackRequest {
  string id = 1;
}

message RetryTakeoverRollbackResponse {
  Takeover takeover = 1;
}

message GetTakeoverRequest {
  string id = 1;
}

message GetTakeoverResponse {
  // Unset when no preflight has run.
  Takeover takeover = 1;
}

enum TakeoverState {
  TAKEOVER_STATE_UNSPECIFIED = 0;
  // Preflight done; waiting for confirmation.
  TAKEOVER_STATE_READY = 1;
  // Preflight found problems that block the takeover.
  TAKEOVER_STATE_BLOCKED = 2;
  TAKEOVER_STATE_RUNNING = 3;
  TAKEOVER_STATE_COMPLETED = 4;
  // A step failed and both hosts' configurations were restored.
  TAKEOVER_STATE_ROLLED_BACK = 5;
  // A step failed and restoring didn't finish; see the steps.
  TAKEOVER_STATE_FAILED = 6;
}

message Takeover {
  TakeoverState state = 1;
  TakeoverPreflight preflight = 2;
  repeated TakeoverStep steps = 3;
  string error = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Set once a step failed and the rollback started; a running takeover
  // that is rolling back resumes the rollback, not the steps.
  bool rolling_back = 6;
}

// TakeoverPreflight is what taking over would do, from both hosts' current
// snapshots.
message TakeoverPreflight {
  google.protobuf.Timestamp checked_at = 1;
  repeated TakeoverDataset datasets = 2;
  // Datasets the old job replicates that the plan doesn't.
  repeated string dropped_datasets = 3;
  // Holds and bookmarks the old jobs' release will remove.
  repeated string primary_releases = 4;
  repeated string dr_releases = 5;
  string primary_zrepl_version = 6;
  string dr_zrepl_version = 7;
  bool upgrade_primary = 8;
  bool upgrade_dr = 9;
  // Other hand-written jobs, left in place.
  repeated string other_jobs = 10;
  // Problems that block the takeover.
  repeated string problems = 11;
  // Concerns that don't block it.
  repeated string warnings = 12;
}

message TakeoverDataset {
  // Dataset on the primary.
  string dataset = 1;
  // Newest snapshot (or primary bookmark) both hosts have; empty when a full
  // send is needed.
  string common_snapshot = 2;
  bool full_send = 3;
  uint64 full_send_bytes = 4;
}

message TakeoverStep {
  string name = 1;
  // "pending", "running", "done", "failed", or "skipped".
  string status = 2;
  string detail = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// OverviewService summarizes every host and plan for the dashboard in one
// call (docs/design/ui.md, section 3).
service OverviewService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
}

message GetOverviewRequest {}

message GetOverviewResponse {
  repeated OverviewHost hosts = 1;
  repeated OverviewPlan plans = 2;
  // Operations in progress or awaiting confirmation, oldest first.
  repeated OverviewOperation operations = 3;
  uint32 firing_alerts = 4;
}

message OverviewHost {
  string id = 1;
  string hostname = 2;
  bool online = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  bool has_inventory = 5;
  // Guests from the latest inventory, by VMID.
  repeated OverviewGuest guests = 6;
}

message OverviewGuest {
  uint32 vmid = 1;
  string name = 2;
  ezdr.inventory.v1.GuestType type = 3;
  // Proxmox VE status, such as "running" or "stopped".
  string status = 4;
  // Proxmox VE lock, such as "migrate" while a plan is failed over.
  string lock = 5;
  // The plan protecting the guest, if any (drafts included).
  string plan_id = 6;
  bool template = 7;
}

message OverviewPlan {
  string id = 1;
  string name = 2;
  PlanState state = 3;
  string primary_host_id = 4;
  string dr_host_id = 5;
  // The protected guests' VMIDs, in startup order.
  repeated uint32 vmids = 6;
  PlanHealth health = 7;
  // Data being copied right now, if any.
  OverviewTransfer transfer = 8;
  // A test failover is running on the DR host.
  bool testing = 9;
  bool pending_changes = 10;
  // When the latest test failover started, if any.
  google.protobuf.Timestamp last_test_at = 11;
}

message OverviewTransfer {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    // Replication, from the primary to the DR host.
    DIRECTION_TO_DR = 1;
    // A failback copy, from the DR host back to the primary.
    DIRECTION_TO_PRIMARY = 2;
  }
  Direction direction = 1;
  // Zero when unknown (for example, while zrepl plans a replication).
  uint64 bytes_expected = 2;
  uint64 bytes_done = 3;
  google.protobuf.Timestamp started_at = 4;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_TAKEOVER = 1;
  OPERATION_KIND_TEST = 2;
  OPERATION_KIND_FAILOVER = 3;
  OPERATION_KIND_FAILBACK = 4;
}

message OverviewOperation {
  OperationKind kind = 1;
  // The test, failover, or failback ID; empty for takeovers (one per plan).
  string id = 2;
  string plan_id = 3;
  string plan_name = 4;
  // What it's doing, such as "running" or "awaiting confirmation".
  string state = 5;
  // The current step's name, if any.
  string step = 6;
  string started_by = 7;
  google.protobuf.Timestamp started_at = 8;
  bool awaiting_confirmation = 9;
}
