version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jlbyh2o/ezdr/internal/gen
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
