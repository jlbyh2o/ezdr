name: Feature request
description: Suggest a feature or an improvement.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, the
        [Ideas discussions](https://github.com/jlbyh2o/ezdr/discussions/categories/ideas)
        are a good place to start. Check the
        [roadmap](https://github.com/jlbyh2o/ezdr/blob/master/docs/architecture.md#9-roadmap)
        too: some features are already planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your setup and what you're trying to do.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like EZDR to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
