# Development toolchain. Run `mise install` to install these versions.
# CI uses the same file, so keep versions here rather than in workflows.

[tools]
go = "1.27.1"
node = "26.10.0"
pnpm = "12.8.1"
golangci-lint = "2.14.0"
buf = "1.73.0"
goreleaser = "2.18.2"
# Keep the protobuf generators in step with the runtime libraries in go.mod.
protoc-gen-go = "1.36.12"
protoc-gen-connect-go = "1.21.0"
